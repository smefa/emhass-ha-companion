run_dayahead:

run_mpc:

train_load_forecaster:

export_settings:

set_snow_cover:
  fields:
    mode:
      required: true
      example: clear
      selector:
        select:
          mode: dropdown
          options:
            - auto
            - covered
            - clear

set_battery_reserve:
  fields:
    target_soc:
      required: true
      default: 80
      example: 80
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    start_time:
      required: false
      selector:
        datetime:
    end_time:
      required: true
      selector:
        datetime:
    reason:
      required: false
      example: Storm warning
      selector:
        text:

clear_battery_reserve:

set_hot_water_plan:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: emhass_companion
    periods:
      required: true
      example: '[{"draw_start": "06:00:00", "draw_end": "08:00:00", "draw_energy_kwh": 3, "enabled": true}]'
      selector:
        object:

test_profile:
  fields:
    profile:
      required: true
      example: price/nordpool_custom
      selector:
        text:
    options:
      required: false
      example: '{"entity": "sensor.nordpool_kwh_se3_sek_3_10_025"}'
      selector:
        object:
    limit:
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 500
          mode: box

typical_load_forecast:
  fields:
    day:
      required: true
      example: "2026-08-07"
      selector:
        date:
    average_w:
      required: true
      example: 1200
      selector:
        number:
          min: 0
          mode: box

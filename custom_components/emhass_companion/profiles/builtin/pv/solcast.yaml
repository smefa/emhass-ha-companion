name: Solcast PV Forecast
kind: pv
version: 1
description: >-
  Reads the detailedForecast attribute of the Solcast PV Forecast integration's
  daily sensors.
notes: >-
  This reads the integration's local cache and costs zero Solcast API calls, so
  it can be re-read every few minutes without touching your daily quota. The
  detailedForecast attribute is half-hourly and already aggregates all
  configured rooftop sites.

detect:
  integration: solcast_solar

options:
  entities:
    name: Forecast sensors
    description: >-
      Today and tomorrow cover the optimisation horizon; the later days let
      the End SOC "Optimized" mode see past it. (Solcast's "tomorrow" is day
      2 -- there is no day-2 sensor.) Selecting more than you need costs
      nothing: reading is local, forecast points past the horizon are ignored
      by EMHASS, and a sensor that is missing is skipped with a warning
      rather than failing the run.
    default:
      - sensor.solcast_pv_forecast_forecast_today
      - sensor.solcast_pv_forecast_forecast_tomorrow
      - sensor.solcast_pv_forecast_forecast_day_3
      - sensor.solcast_pv_forecast_forecast_day_4
    selector:
      entity:
        integration: solcast_solar
        domain: sensor
        multiple: true
  estimate:
    name: Confidence level
    description: >-
      P50 is the central estimate. P10 is pessimistic, which biases the plan
      towards importing rather than assuming sun that may not arrive.
    default: pv_estimate
    selector:
      select:
        mode: dropdown
        options:
          - label: P50 (central estimate)
            value: pv_estimate
          - label: P10 (pessimistic)
            value: pv_estimate10
          - label: P90 (optimistic)
            value: pv_estimate90

source:
  type: attributes
  entity: "{{ options.entities }}"
  attributes:
    - detailedForecast

series:
  time: period_start
  value: "{{ options.estimate }}"
  # Solcast reports kW; EMHASS wants W.
  scale: 1000

unit: watts

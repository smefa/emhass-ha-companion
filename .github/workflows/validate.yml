name: Validate

on:
  push:
  pull_request:
  # Some checks depend on GitHub repository settings rather than on the
  # code, so they need re-running without a commit to change.
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # No `ignore:` needed: HACS's brands check looks for
          # custom_components/emhass_companion/brand/icon.png in the repo
          # tree first and only falls back to the external
          # home-assistant/brands repository if that is absent -- and we ship
          # our own, so nothing here depends on an external PR being merged.

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

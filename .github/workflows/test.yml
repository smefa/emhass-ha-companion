name: Tests

on:
  push:
  pull_request:

env:
  # Home Assistant 2026.7 requires Python 3.14.2 or newer, so this cannot be
  # pinned lower than the version core itself supports.
  PYTHON_VERSION: "3.14"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest

[project]
name = "emhass-companion"
version = "0.1.0"
description = "Home Assistant integration that makes EMHASS usable without YAML"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "BLE",  # blind except - allowed only with an explicit noqa and a reason
    "SIM",  # simplify
    "RUF",
    "ASYNC",
    "PTH",  # use pathlib
]
# Relative imports within an integration package are the Home Assistant
# convention, so TID252 is deliberately not enabled.
ignore = [
    "E501",    # line length handled by formatter
    "RUF012",  # mutable class attrs need ClassVar - noisy for HA entity classes
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

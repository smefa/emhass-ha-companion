[project]
name = "emhass-companion"
version = "0.9.7.4"
description = "Home Assistant integration that makes EMHASS usable without YAML"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
# Home Assistant 2026.7 requires 3.14.2 or newer.
requires-python = ">=3.14"

[tool.ruff]
# Runtime is 3.14 (see requires-python), but formatting targets 3.13 syntax on
# purpose: with py314 the formatter rewrites `except (A, B):` into PEP 758's
# unparenthesised `except A, B:`, which reads as a syntax error to anyone not
# yet on 3.14 and buys nothing.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "BLE",  # blind except - allowed only with an explicit noqa and a reason
    "SIM",  # simplify
    "RUF",
    "ASYNC",
    "PTH",  # use pathlib
]
# Relative imports within an integration package are the Home Assistant
# convention, so TID252 is deliberately not enabled.
ignore = [
    "E501",    # line length handled by formatter
    "RUF012",  # mutable class attrs need ClassVar - noisy for HA entity classes
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The repository root must be on sys.path so `custom_components...` imports
# resolve. `python -m pytest` adds the working directory implicitly, but the
# `pytest` console script CI uses does not, and importlib import mode never
# adds the rootdir. Without this the whole suite fails to collect.
pythonpath = ["."]
# importlib import mode lets tests/ and tests/integration/ hold modules with
# the same basename (test_executor.py exists in both: one pure, one needing a
# running Home Assistant). Under the default prepend mode the second one fails
# to import and the entire run aborts during collection.
addopts = "-q --import-mode=importlib"
